# READY ROOM — one-command local stack.
#
#   docker compose up --build      →  http://localhost:8080
#
# The browser talks only to the frontend nginx origin, which serves the SPA and
# reverse-proxies /api/* to the backend. No external services, databases,
# identity providers, or credentials are required.

services:
  backend:
    build:
      context: ./backend
    environment:
      READY_ROOM_ENVIRONMENT: demo
      READY_ROOM_DB_ADAPTER: sqlalchemy
      # SQLite on a persistent named volume. Point this at a PostgreSQL URL to
      # run the same application against PostgreSQL — no code changes needed.
      READY_ROOM_DATABASE_URL: sqlite:////data/ready_room.db
      READY_ROOM_AUTH_PROVIDER: single_user
      READY_ROOM_OPERATOR_ID: maverick
      READY_ROOM_OPERATOR_DISPLAY_NAME: Maverick
      READY_ROOM_DEFAULT_TIMEZONE: America/New_York
      READY_ROOM_AUTHORIZATION_ENGINE: policy
      READY_ROOM_SEED_ON_STARTUP: "true"
      # --- optional integrations (see DECISIONS D-025 – D-033) ----------
      # Off by default so the base stack stays self-contained. Start the
      # optional servers with `--profile integrations` and switch the providers
      # on to exercise the calendar/mailbox views:
      #   READY_ROOM_CALENDAR_PROVIDER=caldav READY_ROOM_EMAIL_PROVIDER=imap \
      #     docker compose --profile integrations up --build
      READY_ROOM_CALENDAR_PROVIDER: ${READY_ROOM_CALENDAR_PROVIDER:-none}
      READY_ROOM_CALDAV_URL: http://radicale:5232
      READY_ROOM_CALDAV_USERNAME: maverick
      READY_ROOM_CALDAV_PASSWORD: readyroom
      READY_ROOM_CALDAV_CALENDAR: detachment
      READY_ROOM_EMAIL_PROVIDER: ${READY_ROOM_EMAIL_PROVIDER:-none}
      READY_ROOM_IMAP_HOST: greenmail
      READY_ROOM_IMAP_PORT: "3143"
      READY_ROOM_IMAP_USERNAME: maverick@detachment.demo
      READY_ROOM_IMAP_PASSWORD: readyroom
      READY_ROOM_SMTP_HOST: greenmail
      READY_ROOM_SMTP_PORT: "3025"
    volumes:
      - ready_room_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      # Wait for backend *health*, not merely process start.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # --- optional integrations (profile: integrations) ---------------------
  # A self-hosted CalDAV calendar (Radicale) and a demo mail server (GreenMail).
  # They are NOT part of the default stack: the base application runs with no
  # external services. Both are best-effort targets — the backend seeds them
  # non-blockingly and degrades to an "unavailable" view if they are down.
  radicale:
    image: tomsquest/docker-radicale:3.5.6.0
    profiles: ["integrations"]
    ports:
      - "5232:5232"
    volumes:
      - radicale_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5232/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  greenmail:
    image: greenmail/standalone:2.1.3
    profiles: ["integrations"]
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
    environment:
      # A fixed demo account; no external mail service is involved.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3143' || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  ready_room_data:
    name: ready_room_data
  radicale_data:
    name: ready_room_radicale_data
