[project]
name = "ready-room-backend"
version = "0.1.0"
description = "READY ROOM - operational awareness backend for a single operator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI's Depends()/Query() default-argument pattern is idiomatic.
# UP042: str-Enum mixins are intentional — they serialize as plain strings in
#        Pydantic/SQLAlchemy and compare cleanly with the domain's string values.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Test bodies stay readable with long single-call command constructions.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
