# nginx serves the built SPA and reverse-proxies /api/* to the backend service.
# The browser only ever talks to this nginx origin, so there is no CORS in prod.

# Listen on IPv4 and IPv6 so both stack families can reach the SPA. The
# container health check targets 127.0.0.1 (IPv4) explicitly.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lightweight liveness endpoint for the container health check.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy the API to the backend service. In Compose the service is reachable
    # as "backend" on port 8000.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
